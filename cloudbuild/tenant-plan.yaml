# Trigger "tenant-plan": pull request to main; included files: tenants/**, modules/**
# Runs terraform plan for every tenant folder changed in the PR (all tenants if the module changed).
substitutions:
  _TF_VERSION: "1.9.8"

steps:
  - id: plan
    name: "hashicorp/terraform:${_TF_VERSION}"
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        git fetch --depth=100 origin "${_BASE_BRANCH}"
        changed=$$(git diff --name-only "origin/${_BASE_BRANCH}"...HEAD)
        if echo "$$changed" | grep -q '^modules/'; then
          tenants=$$(ls -d tenants/*/ | xargs -n1 basename | grep -v '^_template$$' || true)
        else
          tenants=$$(echo "$$changed" | awk -F/ '$$1=="tenants" && $$2!="_template" {print $$2}' | sort -u)
        fi
        [ -n "$$tenants" ] || { echo "No tenant changes."; exit 0; }
        for t in $$tenants; do
          echo "===== terraform plan: $$t ====="
          cd "tenants/$$t"
          terraform init -input=false -no-color
          terraform validate -no-color
          terraform plan -input=false -lock=false -no-color | tee "/workspace/plan-$$t.txt"
          cd - >/dev/null
        done

serviceAccount: "projects/socfirst-automation/serviceAccounts/tf-tenant-provisioner@socfirst-automation.iam.gserviceaccount.com"
options:
  logging: CLOUD_LOGGING_ONLY
timeout: "1800s"
